<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>My LibriVox Box</title>
<link rel="manifest" href="app.webmanifest">
<meta name="apple-mobile-web-app-title" content="LibriVox Box">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#efeadf; --ink:#2b2620; --muted:#8a8378; --panel:#ffffff; --line:#e4ded2;
  --unread:#e3ddce; --hdr-cell:#d9d0be; --band:#6b4a32;
  --oxblood:#7a2f2b; --teal:#2b5752; --plum:#66304c; --navy:#303d66; --ochre:#8a6a3f; --olive:#5b6633; --slate:#234a5e;
  --serif:Georgia,'Times New Roman',serif; --sans:Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--serif);background:var(--bg);color:var(--ink);min-height:100vh;
  padding:calc(var(--header-h,90px) + 4px) 4px calc(var(--footer-h,0px) + 4px)}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
a{color:inherit}
input{-webkit-user-select:text;user-select:text}
button:focus-visible,input:focus-visible,.book-row:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.screen{display:none;max-width:720px;margin:0 auto}
.screen.active{display:block}

/* ===== bookcloth (Stack Tracker's woven cloth, painted on a canvas) ===== */
.cloth{position:relative;overflow:hidden;background:var(--cloth,var(--olive));color:#fff}
.cloth > canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.cloth > .lbl{position:relative}
.cloth:active > canvas{filter:brightness(.92)}

/* ===== frozen header: walnut band ===== */
.app-header{position:fixed;top:0;left:0;right:0;z-index:9;display:none;flex-direction:column;gap:4px;
  padding:calc(4px + env(safe-area-inset-top)) 4px 4px;background:var(--band);border-top:3px solid #000;border-bottom:3px solid #000}
.app-header.on{display:flex}
.hdr-row{display:flex;align-items:stretch;gap:4px;max-width:720px;width:100%;margin:0 auto}
.hdr-row > *{min-width:0}

/* page tabs: linen cards; the picked one in its bookcloth */
#tabs .tab,.segtabs .tab{flex:1 1 0;height:34px;border:3px solid #000;border-radius:8px;background:var(--hdr-cell);color:var(--ink);
  font:700 min(.74rem,2.95vw)/1 var(--sans);text-transform:uppercase;letter-spacing:.3px}
#tabs .tab > canvas,.segtabs .tab > canvas{display:none}
#tabs .tab.active,.segtabs .tab.active{color:#fff}
#tabs .tab.active > canvas,.segtabs .tab.active > canvas{display:block}
.segtabs{display:flex;gap:4px;margin:4px 0}
.reader-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
/* Narrators: a card that opens into a dropdown of contributor cards (Stack Tracker's dropdown) */
.dd-card{height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;margin-bottom:4px;cursor:pointer;
  background:var(--panel);border:3px solid #000;border-radius:8px}
.dd-card:active{background:var(--hdr-cell)}
.dd-card.open{border-radius:8px 8px 0 0;margin-bottom:0}
.dd-lbl{font:700 .78rem var(--sans);letter-spacing:.3px;text-transform:uppercase;color:var(--ink)}
.dd-arrow{font:700 .8rem var(--sans);color:var(--muted)}
.dd-cur{display:flex;align-items:center;gap:8px;min-width:0;font:700 .66rem var(--sans);letter-spacing:.3px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.dd-panel .ver-opt{margin-bottom:4px}
.sec-row.failed .br-pages{color:var(--oxblood)}
.dl-card{padding:8px 8px 6px}
.dl-top{display:flex;cursor:pointer;margin-bottom:6px}
.pbar{height:14px;border:2.5px solid #000;border-radius:7px;background:var(--hdr-cell);overflow:hidden}
.pbar > div{height:100%;background:var(--olive);border-right:2px solid #000;transition:width .15s linear}
.pbar > div[style^="width:0"]{border-right:none}
.pbar.done > div{background:var(--teal)}
.pbar.failed > div,.pbar.cancelled > div{background:var(--oxblood)}
.pbar.queued > div{background:var(--muted)}
.dl-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;min-height:28px}
.dl-line{font:700 .62rem var(--sans);letter-spacing:.3px;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-btn{flex:none;height:28px;padding:0 12px;border:2.5px solid #000;border-radius:6px;background:var(--panel);font:700 .62rem var(--sans);letter-spacing:.3px;text-transform:uppercase;color:var(--ink)}
.dl-btn:active{background:var(--hdr-cell)}
.helper{padding:10px}
.hp-title{font:700 .78rem var(--sans);letter-spacing:.3px;text-transform:uppercase;color:var(--ink)}
.hp-text{margin-top:4px;font:400 .82rem/1.4 var(--serif);color:var(--ink)}
.hp-step{margin-top:10px;font:700 .62rem var(--sans);letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
.hp-cmd{display:flex;align-items:flex-start;gap:6px;margin-top:4px}
.hp-cmd code{flex:1;min-width:0;padding:6px 8px;background:var(--hdr-cell);border:2px solid #000;border-radius:6px;font:400 .62rem/1.35 ui-monospace,monospace;color:var(--ink);word-break:break-all;-webkit-user-select:all;user-select:all}
.hp-input{flex:1;min-width:0;height:34px;padding:0 8px;border:2px solid #000;border-radius:6px;background:var(--panel);font:400 .72rem ui-monospace,monospace;color:var(--ink)}
.hp-code{white-space:pre-wrap}
.hp-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.dd-panel{margin-bottom:4px;padding:4px 4px 0;background:var(--hdr-cell);border:3px solid #000;border-top:none;border-radius:0 0 8px 8px}
.dd-panel .nr-row{height:45px;padding:0 8px 0 12px}
.nr-go{flex:none;font:700 1.2rem var(--serif);color:var(--muted)}
.reader-chip{height:34px;max-width:100%;padding:0 10px;display:flex;align-items:center;gap:6px;border:3px solid #000;border-radius:8px;background:var(--panel);
  font:700 .72rem var(--sans);color:var(--ink);cursor:pointer}
.reader-chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-chip .ct{flex:none;font:400 .6rem var(--sans);color:var(--muted);text-transform:uppercase}
.reader-chip:active{background:var(--hdr-cell)}
.rd-link{text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.reader-chip::after{content:'›';font:700 1rem var(--serif);color:var(--muted)}

/* filter / sort card, with search */
#sortbar{position:relative;flex:1;height:30px;border:3px solid #000;border-radius:8px;background:var(--panel);overflow:hidden;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.sb-btn{position:absolute;top:0;bottom:0;width:30px;display:flex;align-items:center;justify-content:center;z-index:2}
.sb-btn svg{width:13px;height:13px;display:block}
#sbSearch{left:0;border-right:3px solid #000;background:var(--panel)}
#sbSearch svg{stroke:var(--ink)}
#sbClose{right:0;border-left:3px solid #000;background:var(--oxblood);display:none}
.sb-text{display:flex;align-items:baseline;gap:5px;min-width:0;padding:0 8px 0 38px;
  font:700 min(.74rem,2.95vw)/1 var(--sans);text-transform:uppercase;white-space:nowrap}
.sort-k{color:var(--muted);flex:none}
.sort-v{color:var(--ink);overflow:hidden;text-overflow:ellipsis;min-width:0}
#sortName{flex:none}
.sort-v + .sort-k{margin-left:2px}
#sbQ{position:absolute;left:30px;right:30px;top:0;bottom:0;display:none;border:0;outline:0;background:transparent;
  font:700 min(.8rem,3.3vw) var(--sans);text-transform:uppercase;color:var(--ink);padding:0 8px;-webkit-appearance:none;appearance:none}
#sbQ::placeholder{color:var(--muted)}
#sortbar.searching{cursor:text}
#sortbar.searching .sb-text{visibility:hidden}
#sortbar.searching #sbSearch{background:var(--ink)}
#sortbar.searching #sbSearch svg{stroke:#fff}
#sortbar.searching #sbClose{display:flex}
#sortbar.searching #sbQ{display:block}

/* sub-page header: Back on the left, the title centred on the whole window */
.sh-head{position:fixed;top:0;left:0;right:0;z-index:9;display:none;align-items:stretch;padding-top:env(safe-area-inset-top);
  background:#000;border-top:3px solid #000;border-bottom:3px solid #000}
.sh-head.on{display:flex}
#backBtn{flex:0 0 25%;height:42px;border-right:3px solid #000;font:700 min(.78rem,3.1vw)/1 var(--sans);letter-spacing:.3px;text-transform:uppercase}
.sh-head h2{flex:1 1 0;min-width:0;height:42px;padding:0 25% 0 6px;display:flex;align-items:center;justify-content:center;background:var(--hdr-cell);
  font:700 min(.78rem,3.1vw)/1.1 var(--sans);letter-spacing:.3px;text-transform:uppercase;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head h2 span{overflow:hidden;text-overflow:ellipsis}

/* ===== frozen footer: walnut band ===== */
#app-footer{position:fixed;left:0;right:0;bottom:0;z-index:9;display:none;flex-direction:column;gap:4px;
  padding:4px 4px calc(4px + env(safe-area-inset-bottom));background:var(--band);border-top:3px solid #000}
#app-footer.on{display:flex}
.foot-row{display:flex;gap:4px;max-width:720px;width:100%;margin:0 auto}
.cloth-btn{flex:1 1 0;min-width:0;height:45px;border:3px solid #000;border-radius:8px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.cloth-btn > .lbl{font:700 min(1rem,4vw)/1 var(--serif);letter-spacing:.14em;text-transform:uppercase;color:#fff;white-space:nowrap}
.cloth-btn.sm > .lbl{font-size:min(.8rem,3.2vw);letter-spacing:.08em}
.cloth-btn.wide{flex:2.2 1 0}
.cloth-btn[disabled]{opacity:.5;cursor:default}

/* sample strip (in the footer) */
#player{display:none;height:45px;border:3px solid #000;border-radius:8px;background:var(--panel);overflow:hidden}
#player.show{display:flex}
#pPlay{width:42px;flex:none;border-right:3px solid #000;background:var(--ink);color:#fff;font:700 16px/1 var(--sans)}
#pMid{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 8px;cursor:pointer}
#pTitle{font:600 .84rem/1.1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pseek{display:flex;align-items:center;gap:6px}
.pseek span{font:700 .6rem var(--sans);color:var(--muted);min-width:34px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:8px;background:var(--hdr-cell);border:2px solid #000;border-radius:5px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:4px;background:var(--ink);border:2px solid #000;cursor:pointer}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:4px;background:var(--ink);border:2px solid #000;cursor:pointer}
#pClose{width:30px;flex:none;border-left:3px solid #000;background:var(--oxblood);color:#fff;font:700 15px/1 var(--sans)}

/* ===== list divider (Georgia, uppercase, black rules) ===== */
.list-divider{display:flex;align-items:center;gap:10px;height:40px;padding:0 4px}
.list-divider::before,.list-divider::after{content:'';flex:1;height:3px;background:#000;border-radius:2px}
.ld-name{flex:none;max-width:75%;font:600 .9rem var(--serif);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.5px}

/* ===== book rows ===== */
.book-row{text-decoration:none;color:inherit;position:relative;display:flex;align-items:center;gap:8px;height:56px;padding:0 8px 0 0;margin-bottom:4px;
  background:var(--panel);border:3px solid #000;border-radius:8px;cursor:pointer;overflow:hidden}
.book-row:active{filter:brightness(.96)}
.cover{width:44px;flex:none;align-self:stretch;background:var(--unread);border-right:3px solid #000;display:flex;align-items:center;justify-content:center;
  font:700 1.1rem var(--serif);color:var(--muted);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.br-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.br-title{font:600 .9rem var(--serif);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-author{font:400 .66rem var(--sans);color:rgba(43,38,32,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-prog{flex:none;text-align:right;line-height:1.2;max-width:42%}
.br-pages{font:600 .82rem var(--serif);color:var(--ink);white-space:nowrap}
.br-pct{font:400 .62rem var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
/* saved: a ribbon bookmark hanging over the top edge */
.cover,.bk-cover{position:relative}
/* saved: a ribbon bookmark hanging from the top of the cover, outlined all round, notch included */
.kind{position:absolute;right:2px;bottom:1px;width:18px;height:18px;z-index:2;pointer-events:none;overflow:visible}
/* no box: the figure itself in cream, outlined in black so it reads on any cover */
.kind .o *{fill:#000;stroke:#000;stroke-width:3.2;stroke-linejoin:round}
.kind .f *{fill:#efeadf}
.kind .o .ln{fill:none;stroke:#000;stroke-width:5.4;stroke-linecap:round}
.kind .f .ln{fill:none;stroke:#efeadf;stroke-width:2.2;stroke-linecap:round}
.bk-cover .kind{width:22px;height:22px;right:2px;bottom:1px}
.hero .kind{width:32px;height:32px;right:5px;bottom:3px}
.ribbon{position:absolute;top:-2px;right:5px;width:11px;height:21px;z-index:2;pointer-events:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.ribbon polygon{fill:var(--oxblood);stroke:#000;stroke-width:2;stroke-linejoin:miter}
.bk-cover .ribbon{width:13px;height:25px;right:6px}
.hero .ribbon{width:18px;height:34px;right:10px}

/* ===== small parts ===== */
.hint{width:100%;height:36px;margin-bottom:4px;border:3px solid #000;border-radius:8px;background:var(--hdr-cell);
  font:700 min(.74rem,2.95vw)/1 var(--sans);text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.so-empty{padding:36px 12px;text-align:center;font:400 .8rem/1.4 var(--sans);color:var(--muted)}
.so-empty.err{color:var(--oxblood)}
.spin{display:inline-block;width:20px;height:20px;border:3px solid var(--hdr-cell);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.list-btn{margin:0 0 4px;width:100%}

/* ===== sort & filter page ===== */
.so-opt{text-decoration:none;color:inherit;width:100%;height:45px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;padding:0 8px;margin-bottom:4px;
  background:var(--panel);border:3px solid #000;border-radius:8px;text-align:left}
.so-opt b{font:700 .78rem/1.15 var(--sans);letter-spacing:.3px;text-transform:uppercase;color:var(--ink)}
.so-opt span{font:400 .58rem/1.2 var(--sans);letter-spacing:.3px;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.so-opt.on{background:var(--ink)}
.so-opt.on b{color:#fff}
.so-opt.on span{color:#cfc8ba}
.ver-opt{height:auto;min-height:45px;padding:6px 8px}
.ver-opt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.so-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:4px}

/* ===== book page ===== */
.card{background:var(--panel);border:3px solid #000;border-radius:8px;overflow:hidden;margin-bottom:4px}
.hero{display:flex;min-height:150px}
.hero .cover{width:110px;font-size:2.4rem}
.hero-info{flex:1;min-width:0;padding:10px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.hero-title{font:700 1.15rem/1.2 var(--serif);color:var(--ink);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hero-author{font:400 .8rem var(--sans);color:rgba(43,38,32,.8)}
.hero-meta{font:400 .66rem var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);height:52px;margin-bottom:4px;border:3px solid #000;border-radius:8px}
.stats > canvas{z-index:0}
.stat{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.stat + .stat::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:2px;background:rgba(255,255,255,.35)}
.stat b{font:700 .95rem var(--serif);color:#fff;white-space:nowrap}
.stat small{font:700 .52rem var(--sans);letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.75)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.chip{height:26px;padding:0 9px;display:flex;align-items:center;border:2.5px solid #000;border-radius:6px;background:var(--hdr-cell);
  font:700 .62rem var(--sans);text-transform:uppercase;letter-spacing:.3px;color:var(--ink)}
.desc{padding:10px 10px 8px;font:400 .9rem/1.45 var(--serif);color:var(--ink);cursor:pointer}
.desc .txt{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.desc.open .txt{display:block}
.desc .more{margin-top:4px;font:700 .6rem var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sec-row{height:48px;padding:0 8px}
.sec-n{width:26px;flex:none;font:600 .82rem var(--serif);color:var(--muted);text-align:center}
.sec-row.now{background:var(--ink)}
.sec-row.now .br-title,.sec-row.now .br-pages{color:#fff}
.sec-row.now .br-author,.sec-row.now .sec-n{color:#cfc8ba}

.shelf-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:6px}
.bk-card{position:relative;aspect-ratio:2/3.15;border:3px solid #000;border-radius:3px 8px 8px 3px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;padding:7px 6px 6px 8px;color:#fff;text-align:center}
.bk-card:active{filter:brightness(.94)}
.bk-card > *:not(canvas){position:relative}
.bk-cover{width:92%;aspect-ratio:1/1;flex:none;border:2.5px solid #000;border-radius:3px;background:var(--unread);overflow:hidden;
  display:flex;align-items:center;justify-content:center;font:700 1.2rem var(--serif);color:var(--muted)}
.bk-cover img{width:100%;height:100%;object-fit:cover;display:block}
.bk-title{margin-top:5px;width:100%;font:700 min(.64rem,2.75vw)/1.15 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 0 rgba(0,0,0,.35)}
.bk-author{margin-top:2px;width:100%;font:400 min(.52rem,2.2vw)/1.15 var(--sans);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-len{margin-top:auto;padding-top:3px;font:700 min(.58rem,2.45vw)/1 var(--serif);letter-spacing:.03em;opacity:.95}

.btn-row{display:flex;gap:4px;margin-bottom:4px}
.toast{position:fixed;left:50%;top:calc(var(--header-h,90px) + 10px);transform:translateX(-50%);background:var(--ink);border:3px solid #000;border-radius:8px;
  color:#fff;padding:8px 14px;font:700 .75rem var(--sans);text-transform:uppercase;letter-spacing:.3px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- home header: page tabs, then filter / sort / search -->
<header class="app-header on" id="homeHeader">
  <div class="hdr-row" id="tabs">
    <button class="tab cloth active" data-tab="main" data-cloth="#7a2f2b"><canvas aria-hidden="true"></canvas><span class="lbl">Main</span></button>
    <button class="tab cloth" data-tab="browse" data-cloth="#303d66"><canvas aria-hidden="true"></canvas><span class="lbl">Browse</span></button>
    <button class="tab cloth" data-tab="saved" data-cloth="#2b5752"><canvas aria-hidden="true"></canvas><span class="lbl">Saved</span></button>
    <button class="tab cloth" data-tab="downloads" data-cloth="#5b6633"><canvas aria-hidden="true"></canvas><span class="lbl">Downloads</span></button>
  </div>
  <div class="hdr-row" id="sortRow">
    <div id="sortbar">
      <span class="sb-btn" id="sbSearch" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg></span>
      <input id="sbQ" type="text" placeholder="Title or author" aria-label="Search titles and authors" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <span class="sb-btn" id="sbClose" aria-label="Close search"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
      <div class="sb-text"><span class="sort-k">Filter by:</span><span class="sort-v" id="filterName">All books</span><span class="sort-k">• Sort by:</span><span class="sort-v" id="sortName">Newest</span></div>
    </div>
  </div>
</header>

    drop.forEach(k => localStorage.removeItem(k));
    localStorage.setItem('lv_dataver', String(DATA_VERSION));
  }
} catch(e) {}
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let prefs = Object.assign({ sort:'newest', len:'any', lang:'all', genre:'' }, store.get('lv_prefs', {}));
const savePrefs = () => store.set('lv_prefs', prefs);

// ================= API =================
const API = 'https://librivox.org/api/feed/audiobooks/';
const cache = new Map();

function qs(params){
  return Object.entries(params).filter(([,v]) => v !== undefined && v !== '')
    .map(([k,v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
}
function jsonp(url, ms = 9000){
  return new Promise((res, rej) => {
    const cb = 'lvcb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    const s = document.createElement('script');
    let t;
    const done = () => { clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } s.remove(); };
    window[cb] = d => { done(); res(d); };
    s.onerror = () => { done(); const e = new Error('jsonp'); e.http = true; rej(e); };   // the server answered with an error (e.g. 404)
    t = setTimeout(() => { done(); rej(new Error('timeout')); }, ms);
    s.src = url + '&callback=' + cb;
    document.head.appendChild(s);
  });
}
async function fetchJSON(url, ms = 9000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);

    const r = await fetch(url, { signal: ctl.signal });
    const txt = await r.text();
    if (/could not be found/i.test(txt)) return { books: [], _notFound: true };
    if (!r.ok) throw new Error('http ' + r.status);
    return JSON.parse(txt);
  } finally { clearTimeout(t); }
}

// ---- saved responses: repeat visits load from the phone instead of the network ----
const PC = {
  get(key, maxAge){
    try { const v = JSON.parse(localStorage.getItem('lvc:' + key) || 'null'); if (v && Date.now() - v.t < maxAge) return v.v; } catch(e){}
    return null;
  },
  set(key, val){
    const item = JSON.stringify({ t: Date.now(), v: val });
    for (let tries = 0; tries < 4; tries++){
      try { localStorage.setItem('lvc:' + key, item); return; }
      catch(e){ PC.evict(); }   // storage full: drop the oldest saved responses and try again
    }
  },
  evict(){
    try {
      const all = [];
      for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith('lvc:')) { let t = 0; try { t = JSON.parse(localStorage.getItem(k)).t; } catch(e){} all.push([t, k]); } }
      all.sort((a, b) => a[0] - b[0]).slice(0, Math.max(5, Math.ceil(all.length / 3))).forEach(([, k]) => localStorage.removeItem(k));
    } catch(e){}
  }
};
const HOUR = 3600e3, DAY = 24 * HOUR;

// ---- one way in for every request ----
// JSONP and a direct fetch race each other; whichever answers first wins, and the winner is remembered per site
// so it goes first next time. The public proxies are only a last resort.
let transport = store.get('lv_transport', {});
async function getData(host, jsonpUrl, jsonUrl, valid){
  const pref = transport[host];
  const check = via => d => { if (!d || !(d._notFound || valid(d))) throw new Error('bad data'); return { d, via }; };   // only real data can win
  const tryJsonp = () => jsonp(jsonpUrl).then(check('jsonp'));
  const tryFetch = () => fetchJSON(jsonUrl).then(check('fetch'));
  const win = r => { if (transport[host] !== r.via) { transport[host] = r.via; store.set('lv_transport', transport); } return r.d; };
  try {
    if (pref === 'jsonp') return win(await tryJsonp());
    if (pref === 'fetch') return win(await tryFetch());
    return win(await Promise.any([tryJsonp(), tryFetch()]));
  } catch(e) {
    // the site's known-good route came back with an error page: that's "nothing found", not a network problem
    const errs = e instanceof AggregateError ? e.errors : [e];
    if (pref && errs.some(x => x && x.http)) return { books: [], _notFound: true };
    if (pref) { try { return win(await (pref === 'jsonp' ? tryFetch() : tryJsonp())); } catch(e2){} }
  }
  try { return await Promise.any([
    fetchJSON('https://api.allorigins.win/raw?url=' + encodeURIComponent(jsonUrl), 12000).then(d => check('proxy')(d).d),
    fetchJSON('https://corsproxy.io/?url=' + encodeURIComponent(jsonUrl), 12000).then(d => check('proxy')(d).d)
  ]); } catch(e){}
  return null;
}

async function api(params, maxAge){
  const key = qs(params);
  if (cache.has(key)) return cache.get(key);
  const ttl = maxAge || (params.id ? 7 * DAY : params.fields ? 7 * DAY : 2 * HOUR);
  const saved = PC.get('lv|' + key, ttl);
  if (saved) { cache.set(key, saved); return saved; }
  const out = await getData('librivox', API + '?' + qs({...params, format:'jsonp'}), API + '?' + qs({...params, format:'json'}), d => 'books' in d);
  const norm = { books: out && out.books ? (Array.isArray(out.books) ? out.books : Object.values(out.books)) : [], failed: !out };
  if (!norm.failed) { cache.set(key, norm); PC.set('lv|' + key, norm); }
  return norm;
}

const KIND_DEF = {

  both:  { vb: '0 0 24 24', label: 'Solo and group versions', sh: '<path class="ln" d="M8.6 7a5 5 0 1 1 0 10a5 5 0 1 1 0-10M15.4 7a5 5 0 1 1 0 10a5 5 0 1 1 0-10"/>' }

// ================= SORT / FILTER DEFINITIONS =================
const SORTS = [

  { id:'oldest', name:'Oldest',     desc:'First books added to LibriVox',   server:'asc' },
  { id:'title',  name:'Title A–Z',  desc:'Ignores leading The / A / An',    fn:(a,b) => sortTitle(a).localeCompare(sortTitle(b)) },
  { id:'author', name:'Author A–Z', desc:'By last name',                    fn:(a,b) => lastName(a).localeCompare(lastName(b)) || sortTitle(a).localeCompare(sortTitle(b)) },
  { id:'short',  name:'Shortest',   desc:'Least listening time first',     fn:(a,b) => secsOf(a) - secsOf(b) },
  { id:'long',   name:'Longest',    desc:'Most listening time first',       fn:(a,b) => secsOf(b) - secsOf(a) },
  // popularity: LibriVox has no stats, so these load from the Internet Archive, which hosts every recording
  { id:'popular', name:'Most Popular',      desc:'All-time downloads · Internet Archive',   ia:'downloads desc', stat:'downloads' },
  { id:'week',    name:'Trending This Week', desc:'Downloads in the last 7 days · Internet Archive',  ia:'week desc',  stat:'week' },

  { id:'rated',   name:'Top Rated',          desc:'Average rating, 3+ reviews · Internet Archive',     ia:'avg_rating desc', stat:'rating', minReviews:3 },
  { id:'reviewed',name:'Most Reviewed',      desc:'Number of reviews · Internet Archive',              ia:'num_reviews desc', stat:'reviews' }
];
const LENS = [
  { id:'any', name:'Any length', desc:'Every book',          test:() => true },
  { id:'u1',  name:'Under 1 hr', desc:'Short works',         test:s => s > 0 && s < 3600 },
  { id:'1-5', name:'1–5 hrs',    desc:'An afternoon or two', test:s => s >= 3600 && s < 18000 },
  { id:'5-10',name:'5–10 hrs',   desc:'A typical novel',     test:s => s >= 18000 && s < 36000 },
  { id:'10+', name:'10+ hrs',    desc:'Long reads',          test:s => s >= 36000 }
];
// keywords: LibriVox's genre search matches anywhere in the genre name
const GENRES = [
  ['Adventure','Action & adventure'], ['Children','Children\'s'], ['Detective','Detective & mystery'],
  ['Science Fiction','Science fiction'], ['Fantas','Fantasy & fantastic'], ['Horror','Horror & supernatural'],
  ['Gothic','Gothic'], ['Humor','Humorous'], ['Romance','Romance'], ['Historical Fiction','Historical fiction'],
  ['War','War & military'], ['Western','Westerns'], ['Nautical','Nautical & marine'], ['Short Stories','Short stories'],
  ['Myths','Myths, legends & fairy tales'], ['Poetry','Poetry'], ['Drama','Plays & drama'],
  ['Biography','Biography & memoir'], ['History','History'], ['Philosophy','Philosophy'], ['Religion','Religion'],
  ['Travel','Travel & geography'], ['Nature','Nature'], ['Essays','Essays & short works'], ['Letters','Letters']
];
const curSort = () => SORTS.find(s => s.id === prefs.sort) || SORTS[0];
const curLen = () => LENS.find(l => l.id === prefs.len) || LENS[0];
const genreName = () => (GENRES.find(g => g[0] === prefs.genre) || [,''])[1];

function filterLabel(){
  const parts = [];
  if (prefs.genre) parts.push(genreName());
  if (prefs.lang !== 'all') parts.push(prefs.lang);
  if (prefs.len !== 'any') parts.push(curLen().name);
  return parts.join(' · ') || 'All books';
}
function updateBar(){ $('filterName').textContent = filterLabel(); $('sortName').textContent = curSort().name; }

// apply client-side search / filter / sort to a list of books
function view(books, collapse = true){
  const q = searchLive.trim().toLowerCase();
  const len = curLen(), s = curSort();
  let out = books.filter(b =>
    (prefs.lang === 'all' || (b.language || '') === prefs.lang) &&
    (b.ia != null || len.test(secsOf(b))) &&
    (!q || String(b.title||'').toLowerCase().includes(q) || authors(b).toLowerCase().includes(q)));
  if (s.fn) out = out.slice().sort(s.fn);   // popularity sorts keep the Internet Archive's order
  return collapse ? groupVersions(out) : out;
}
// the same book under one key: title without "(version 2)" / "(Dramatic Reading)" and subtitles, plus the author's last name
const baseTitle = t => String(t || '').replace(/\s*\([^)]*\)\s*/g, ' ').split(':')[0].replace(/\s+/g, ' ').trim();
const workKey = b => normT(baseTitle(b.title)) + '|' + String(b.iaLast || (b.authors && b.authors[0] && (b.authors[0].last_name || b.authors[0].first_name)) || '').toLowerCase().trim();

  const first = new Map();
  books.forEach(b => { const k = workKey(b); if (!first.has(k)) first.set(k, { b, n: 0 }); first.get(k).n++; });
  return [...first.values()].map(({ b, n }) => (b._versions = n, b));
}

function bookCard(b){

// ================= HOME =================
let tab = 'main';

// ===== Internet Archive (popularity sorts) =====
const IA = 'https://archive.org/advancedsearch.php';
const IA_FIELDS = ['identifier','title','creator','language','downloads','week','month','avg_rating','num_reviews'];
async function iaSearch(q, sort, page, rows = PAGE){
  const qp = 'q=' + encodeURIComponent(q) + IA_FIELDS.map(f => '&fl[]=' + f).join('') + '&sort[]=' + encodeURIComponent(sort) + '&rows=' + rows + '&page=' + page;
  const key = 'ia|' + qp;
  if (cache.has(key)) return cache.get(key);
  const saved = PC.get(key, 12 * HOUR);
  if (saved) { cache.set(key, saved); return saved; }
  const out = await getData('archive', IA + '?' + qp + '&output=json', IA + '?' + qp + '&output=json', d => !!(d.response && d.response.docs));
  const docs = out && out.response && out.response.docs;
  if (!docs) return { books: [], failed: true };
  const norm = { books: docs.map(iaToBook), total: out.response.numFound || 0 };
  cache.set(key, norm); PC.set(key, norm);
  return norm;
}
const one = v => Array.isArray(v) ? v[0] : v;
function iaToBook(d){
  const flip = c => { c = String(c).replace(/,\s*(fl\.\s*)?\d{3,4}\??-(\d{3,4})?\??\s*$/, '').trim(); const m = c.match(/^([^,]+),\s*([^,]+)$/); return m ? m[2] + ' ' + m[1] : c; };
  const creator = [].concat(d.creator || []).map(flip).join(', ');
  return {
    id: 'ia:' + d.identifier, ia: d.identifier,
    iaLast: (() => { const c = String([].concat(d.creator || [])[0] || ''); return /librivox|various|anonymous|unknown/i.test(c) ? '' : (c.includes(',') ? c.split(',')[0] : c.split(' ').pop()).trim(); })(),
    title: String(one(d.title) || d.identifier).replace(/\s*\(version \d+[^)]*\)\s*$/i, ''),
    authors: creator ? [{ first_name:'', last_name: creator }] : [],
    language: normLang(one(d.language)),
    coverart_thumbnail: 'https://archive.org/services/img/' + d.identifier,
    downloads: +d.downloads || 0, week: +d.week || 0, month: +d.month || 0,
    avg_rating: +d.avg_rating || 0, num_reviews: +d.num_reviews || 0
  };
}
const LANGS = { eng:'English', ger:'German', deu:'German', fre:'French', fra:'French', spa:'Spanish', ita:'Italian', dut:'Dutch', nld:'Dutch', por:'Portuguese', rus:'Russian', chi:'Chinese', zho:'Chinese', jpn:'Japanese', lat:'Latin', grc:'Ancient Greek', gre:'Greek', pol:'Polish', swe:'Swedish', fin:'Finnish', dan:'Danish', nor:'Norwegian', heb:'Hebrew', hun:'Hungarian', tag:'Tagalog' };

  let q = 'collection:librivoxaudio';

}
const n = x => Number(x || 0).toLocaleString();
function statLine(b){
  const st = curSort().stat;

async function reload(){

  renderHome(true);
  if (curSort().ia) { list.page = 1; return loadMore(token); }
  if (searchAll){
    // one search box: look up the words as a title and as an author's last name, then merge
    const p = baseParams();
    const [t, a] = await Promise.all([ api({ ...p, title: searchAll, coverart:1, limit:PAGE }), api({ ...p, author: searchAll, coverart:1, limit:PAGE }) ]);
    if (reload.token !== token) return;
    const seen = new Set();
    [...t.books, ...a.books].forEach(b => { if (!seen.has(b.id)) { seen.add(b.id); list.books.push(b); } });
    list.error = t.failed && a.failed; list.done = true;
    renderHome(); return;
  }
  await loadMore(token);
}
async function loadMore(token = reload.token){
  if (list.books.length) renderHome(true);
  const s = curSort();
  const res = s.ia ? await iaSearch(iaQuery(), s.ia, list.page || 1) : await api({ ...baseParams(), coverart:1, limit:PAGE, offset:list.offset });
  if (s.ia) list.page = (list.page || 1) + 1;
  if (reload.token !== token) return;
  if (res.failed){ list.error = true; renderHome(); return; }
  list.error = false;
  const seen = new Set(list.books.map(b => b.id));
  res.books.forEach(b => { if (!seen.has(b.id)) list.books.push(b); });
  list.offset += PAGE;
  list.done = res.books.length < PAGE;
  renderHome();
}

const clothFor = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) | 0; return BOOK_CLOTHS[Math.abs(h) % BOOK_CLOTHS.length]; };
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const dedupe = books => { const seen = new Set(); return books.filter(b => { const k = normT(b.title) + '|' + (b.iaLast || '').toLowerCase(); return !seen.has(k) && seen.add(k); }); };
async function loadMain(){
  // 1) last session's pool, straight from the phone

    main.pool = saved.pool; main.loading = false; pickMain();
    if (Date.now() - saved.t < 12 * HOUR) return;           // fresh enough

    const rest = await Promise.all([2, 3].map(p => iaSearch('collection:librivoxaudio', 'downloads desc', p)));
    main.pool = dedupe(first.books.concat(...rest.map(r => r.books)));
    store.set('lv_mainpool', { t: Date.now(), pool: main.pool.map(b => ({ ...b, _lenTried: false })) });

let current = null;
let narrOpen = false;   // the Narrators dropdown on the book page
let verOpen = false;    // the Versions dropdown

// Internet Archive item -> LibriVox project (matched by url_iarchive, then by title)
let iaMap = store.get('lv_iamap', {});   // remembered matches: IA identifier -> LibriVox id
const normT = t => String(t || '').toLowerCase().replace(/&/g, ' and ').replace(/\([^)]*\)/g, ' ')
  .replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\b(the|a|an)\b/g, ' ').replace(/\s+/g, ' ').trim();
function sim(a, b){
  const A = new Set(normT(a).split(' ').filter(Boolean)), B = new Set(normT(b).split(' ').filter(Boolean));
  if (!A.size || !B.size) return 0;
  let k = 0; A.forEach(w => B.has(w) && k++);
  return k / Math.max(A.size, B.size);
}
const iaOf = u => (String(u || '').match(/archive\.org\/details\/([^/?#\s]+)/i) || [])[1] || '';

// light candidate lookup: only the fields needed to match, so author lists stay small
async function candidates(params){
  const lite = await api({ ...params, extended:1, limit:500, fields:'{id,title,url_iarchive,authors,totaltime,totaltimesecs}' });
  if (!lite.failed && (!lite.books.length || 'url_iarchive' in lite.books[0])) return lite.books;
  return (await api({ ...params, extended:1, limit:100 })).books;
}

// Internet Archive item -> LibriVox project
async function resolveIA(ident, title, last){
  const want = ident.toLowerCase();
  const full = async id => (await api({ id, extended:1, coverart:1 })).books[0];
  if (iaMap[ident]) { const b = await full(iaMap[ident]); if (b) return b; }
  const remember = async b => { iaMap[ident] = b.id; store.set('lv_iamap', iaMap); return b.sections ? b : (await full(b.id)) || b; };

  const pool = new Map();
  const check = list => { for (const b of list){ pool.set(b.id, b); if (iaOf(b.url_iarchive).toLowerCase() === want) return b; } return null; };

  // 1) by author last name — reliable, and every project by that author is checked against the IA link
  if (last){
    const hit = check(await candidates({ author: last }));
    if (hit) return remember(hit);
  }
  // 2) by title chunks
  const words = normT(title).split(' ').filter(Boolean);
  const tries = [words.slice(0, 4).join(' '), words.slice(0, 2).join(' '), [...words].sort((x, y) => y.length - x.length)[0]]
    .filter((t, i, a) => t && t.length > 2 && a.indexOf(t) === i);
  for (const t of tries){
    const hit = check(await candidates({ title: t }));
    if (hit) return remember(hit);
  }
  // 3) closest title among everything seen (same author when known)
  let best = null, score = 0;
  pool.forEach(b => {
    let sc = sim(title, b.title);
    if (last && authors(b).toLowerCase().includes(last.toLowerCase())) sc += 0.15;
    if (sc > score) { score = sc; best = b; }
  });
  return best && score >= 0.75 ? remember(best) : null;
}

// ================= VERSIONS =================
// LibriVox records each reading as its own project; find the others with the same title and author
const versions = { key: '', list: [], loading: false };
const verLabel = t => { const m = String(t || '').match(/\(([^)]*(version|dramatic|abridged|reading)[^)]*)\)/i); return m ? m[1].replace(/\b\w/g, c => c.toUpperCase()) : 'Version 1'; };
function readerInfo(v){
  const names = [...new Set((v.sections || []).flatMap(s => (s.readers || []).map(r => r.display_name)).filter(Boolean))];
  const drama = /dramatic/i.test(v.title || '');
  if (drama) return { type: 'Dramatic', who: names.length ? names.length + ' readers' : 'Full cast' };
  if (names.length === 1) return { type: 'Solo', who: names[0] };
  if (names.length > 1) return { type: 'Group', who: names.length + ' readers' };
  return { type: '', who: '' };
}
async function loadVersions(b, preferTop){
  const key = workKey(b);
  if (versions.key === key && versions.list.length) { renderVersions(); return; }
  versions.key = key; versions.list = []; versions.loading = true; renderVersions();
  const title = baseTitle(b.title);
  const F = VERSION_FIELDS;
  let res = await api({ title, extended:1, limit:50, fields: F });
  if (res.failed || (res.books.length && !('url_iarchive' in res.books[0]))) res = await api({ title, extended:1, limit:50 });
  if (versions.key !== key) return;
  const list = res.books.filter(v => workKey(v) === key);
  if (!list.some(v => v.id == b.id)) list.push(b);
  // downloads for each version, in one Internet Archive lookup
  const ids = list.map(v => iaOf(v.url_iarchive)).filter(Boolean);
  if (ids.length > 1) {
    const ia = await iaSearch('identifier:(' + ids.map(x => '"' + x + '"').join(' OR ') + ')', 'downloads desc', 1, 50);
    const dl = new Map(ia.books.map(x => [x.ia.toLowerCase(), x.downloads]));
    list.forEach(v => v._dl = dl.get(iaOf(v.url_iarchive).toLowerCase()) || 0);
  }
  list.sort((x, y) => (y._dl || 0) - (x._dl || 0) || (+x.id) - (+y.id));
  if (versions.key !== key) return;
  versions.list = list; versions.loading = false;
  rememberKinds(key, list.map(v => readerInfo(v).type === 'Solo' ? 'solo' : readerInfo(v).type ? 'group' : '').filter(Boolean));
  // opened from a list: switch to the reading most people choose
  if (preferTop && list.length > 1 && list[0].id != b.id && current && current.id == b.id && !(sample && sample.book.id == b.id)) { switchVersion(list[0].id); return; }
  renderVersions();
}
function renderVersions(){
  const el = $('versionsBox'); if (!el || !current) return;
  if (versions.loading) { el.innerHTML = `<div class="dd-card"><span class="dd-lbl">Versions</span><span class="dd-cur"><span class="spin" style="width:14px;height:14px;margin:0"></span></span></div>`; return; }
  if (versions.list.length < 2) { el.innerHTML = ''; return; }
  const n = x => Number(x || 0).toLocaleString();
  const cur = versions.list.find(v => v.id == current.id);
  // one card that says Versions (with the reading you're on); tap it to drop down a card per version
  let h = `<div class="dd-card ${verOpen ? 'open' : ''}" data-veropen role="button" tabindex="0" aria-expanded="${verOpen}">
    <span class="dd-lbl">Versions</span><span class="dd-cur">${esc(cur ? verLabel(cur.title) : '')}<span class="dd-arrow">${verOpen ? '▴' : '▾'}</span></span></div>`;
  if (verOpen) h += `<div class="dd-panel">${versions.list.map((v, i) => {
    const r = readerInfo(v), on = v.id == current.id;
    const lbl = verLabel(v.title), head = [lbl, lbl.toLowerCase().includes(r.type.toLowerCase()) ? '' : r.type, r.who].filter(Boolean).join(' · ');
    const sub = [v.totaltime, v.language, v._dl ? n(v._dl) + ' downloads' : '', i === 0 && v._dl ? 'most popular' : ''].filter(Boolean).join(' · ');
    return `<button class="so-opt ver-opt ${on ? 'on' : ''}" data-ver="${esc(v.id)}"><b>${esc(head)}</b><span>${esc(sub)}</span></button>`;
  }).join('')}</div>`;
  el.innerHTML = h;
}
async function switchVersion(id){
  verOpen = false;
  if (current && current.id == id) { renderVersions(); return; }
  const y = window.scrollY;
  const b = (await api({ id, extended:1, coverart:1 })).books[0];
  if (!b) { toast('Couldn\u2019t load that version'); return; }

function renderBook(){
  const b = current; if (!b) return;
  $('hTitle').textContent = baseTitle(b.title) || b.title;
  const secs = b._secs;
  const here = sample && sample.book.id == b.id;
  const desc = stripHTML(b.description);
  const genres = (b.genres || []).map(g => g.name).filter(Boolean);
  const sampling = here && !audio.paused;
  const meta = [b.copyright_year && b.copyright_year !== '0' ? b.copyright_year : '', b.translators && b.translators.length ? 'Trans. ' + b.translators.map(a => [a.first_name,a.last_name].filter(Boolean).join(' ')).join(', ') : ''].filter(Boolean).join(' · ');

const AUDIO_EXT = /\.(mp3|m4a|m4b|ogg|opus|flac|wav)$/i;
async function zipEntries(file){
  const u16 = (v, o) => v.getUint16(o, true), u32 = (v, o) => v.getUint32(o, true), u64 = (v, o) => Number(v.getBigUint64(o, true));

  let e = -1;
  for (let i = tailLen - 22; i >= 0; i--) if (u32(tail, i) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('not a zip');

    if (loc >= 0 && u32(tail, loc) === 0x07064b50) {
      const z = new DataView(await file.slice(u64(tail, loc + 8), u64(tail, loc + 8) + 56).arrayBuffer());
      if (u32(z, 0) === 0x06064b50) { count = u64(z, 32); cdSize = u64(z, 40); cdOff = u64(z, 48); }
    }

        if (off === 0xFFFFFFFF) { off = u64(cd, q); q += 8; }

    }
    out.push({ name, method, comp, size, off });

async function zipStream(file, en){

aders });   // streamed straight through\n  }\n};";

async function readerTitles(id){
  const key = 'rds|' + id, saved = PC.get(key, DAY);
  if (saved) return saved;
  const url = 'https://librivox.org/sections/readers/' + encodeURIComponent(id);
  const ok = t => { if (!/reader_view/.test(t)) throw new Error('not the section page'); return t; };
  let txt = null;
  // free relays that allow live websites; a reader with hundreds of sections makes a big, slow page, so allow time
  try { txt = await Promise.any([
    fetchText('https://api.allorigins.win/raw?url=' + encodeURIComponent(url), 40000).then(ok),
    fetchText('https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(url), 40000).then(ok)
  ]); } catch(e) {}
  if (txt == null) return { titles: [], failed: true };
  const doc = new DOMParser().parseFromString(txt, 'text/html');
  const rows = [...doc.querySelectorAll('#reader_view tbody tr')];
  const titles = [...new Set(rows.filter(r => r.cells.length > 1 && /^\s*complete\s*$/i.test(r.cells[1].textContent))
    .map(r => r.cells[0].textContent.replace(/\s+/g, ' ').trim()).filter(Boolean))];
  const res = { titles };

async function lookupReaderTitle(rid, title){
  const k = rid + '|' + title;
  if (readerFound[k]) return readerFound[k];
  const want = normT(baseTitle(title) || title);
  const q = { title: baseTitle(title) || title, extended: 1, coverart: 1, limit: 50, fields: '{id,title,authors,sections,coverart_thumbnail}' };
  // straight through, not the general cache: these answers carry every section, so only the summary is kept
  const out = await getData('librivox', API + '?' + qs({ ...q, format: 'jsonp' }), API + '?' + qs({ ...q, format: 'json' }), d => 'books' in d);
  const books = out && out.books ? (Array.isArray(out.books) ? out.books : Object.values(out.books)) : [];
  const same = books.filter(b => normT(baseTitle(b.title) || b.title) === want);
  const hasReader = b => (b.sections || []).some(s => (s.readers || []).some(r => String(r.reader_id) === String(rid)));
  const b = same.find(hasReader) || (same.length === 1 ? same[0] : null);
  if (!b) return null;
  const voices = new Set((b.sections || []).flatMap(s => (s.readers || []).map(r => r.reader_id || r.display_name)));
  const found = { id: b.id, title: b.title, author: authors(b), cover: b.coverart_thumbnail || '', kind: voices.size > 1 ? 'group' : 'solo' };
  readerFound[k] = found;
  const keys = Object.keys(readerFound); if (keys.length > 1500) keys.slice(0, keys.length - 1500).forEach(x => delete readerFound[x]);
  store.set('lv_rdfound', readerFound);
  return found;
}
async function loadReaderGroup(){
  const id = reader.id, bk = reader.backup = { titles: [], done: 0, loading: true, failed: false };
  reader.group = { items: [], done: true };
  renderReader();
  const res = await readerTitles(id);
  if (reader.id !== id) return;
  bk.loading = false;
  if (res.failed) { bk.failed = true; renderReader(); return; }
  bk.titles = res.titles.slice().sort((a, b) => normT(a).localeCompare(normT(b)));
  renderReader();
  let next = 0, redraw = 0;
  const worker = async () => {
    while (reader.id === id && next < bk.titles.length) {
      const t = bk.titles[next++];
      let f = null; try { f = await lookupReaderTitle(id, t); } catch(e) {}
      if (reader.id !== id) return;
      bk.done++;
      if (f) {
        const st = reader[f.kind] || (reader[f.kind] = { items: [], page: 0, done: true });
        // a solo book the archive search already found isn't added twice
        if (!st.items.some(x => x.id == f.id || normT(baseTitle(x.title) || x.title) === normT(baseTitle(f.title) || f.title))) {
          st.items.push({ ...f, meta: '' }); st.items.sort((a, b) => normT(a.title).localeCompare(normT(b.title)));
        }

      clearTimeout(redraw); redraw = setTimeout(() => { if (reader.id === id) { const y = window.scrollY; renderReader(); window.scrollTo(0, y); } }, 200);
    }
  };
  await Promise.all([worker(), worker(), worker()]);
}

      <div class="br-prog"><div class="br-pct">${esc(x.meta)}</div></div></div>`).join('');
    if (st.loading) h += loading('Loading more');
    else if (!st.done) h += clothBtn('data-rmore', '#303d66', 'More', 'list-btn');
  }
  h += clothLink('https://librivox.org/reader/' + reader.id, '#234a5e', 'LibriVox Page ↗', 'list-btn');
  $('readerBody').innerHTML = h; paintCloth($('readerBody'));
  if (!st || (t === 'group' && !bk)) loadReader(t);
}
// a catalog entry -> its LibriVox project id (title search, matched on the project's page link)
async function openReaderItem(x){
  if (x.id) return openBook(x.id);
  const norm = u => String(u || '').replace(/^https?:\/\/(www\.)?/i, '').replace(/\/+$/, '').toLowerCase();
  const want = norm(x.link);
  toast('Opening…');
  const res = await api({ title: baseTitle(x.title) || x.title, limit: 50, fields: '{id,title,url_librivox,authors}' });
  let hit = res.books.find(b => norm(b.url_librivox) === want);
  if (!hit) { const full = await api({ title: baseTitle(x.title) || x.title, limit: 50 }); hit = full.books.find(b => norm(b.url_librivox) === want) || full.books.find(b => (b.title || '').toLowerCase() === x.title.toLowerCase()); }
  if (hit) openBook(hit.id); else if (x.link) window.open(https(x.link), '_blank', 'noopener');
}

// ================= NAV =================
// Back history: the browser's when it's allowed, otherwise the demo keeps its own stack
const NAV = { browser: true, stack: [null] };
function hpush(state, title, url){
  if (NAV.browser) { try { history.pushState(state, '', url); return; } catch(e) { try { history.pushState(state, ''); return; } catch(e2) { NAV.browser = false; } } }
  NAV.stack.push(state);
}
function hreplace(state, title, url){
  if (NAV.browser) { try { history.replaceState(state, '', url); return; } catch(e) { try { history.replaceState(state, ''); return; } catch(e2) { NAV.browser = false; } } }
  NAV.stack[NAV.stack.length - 1] = state;
}
const hstate = () => NAV.browser ? history.state : NAV.stack[NAV.stack.length - 1];
function hback(){ if (NAV.browser) { history.back(); return; } if (NAV.stack.length > 1) NAV.stack.pop(); onPop({ state: hstate() }); }

let screen = 'home';
function show(s, bookId, push = true){
  screen = s;
  $('home').classList.toggle('active', s === 'home');
  $('sortScreen').classList.toggle('active', s === 'sort');
  $('bookScreen').classList.toggle('active', s === 'book');
  $('dlScreen').classList.toggle('active', s === 'dl');
  $('readerScreen').classList.toggle('active', s === 'reader');
  $('homeHeader').classList.toggle('on', s === 'home');
  $('subHeader').classList.toggle('on', s !== 'home');
  if (s === 'home'){ current = null; renderHome(); paintCloth($('homeHeader')); }
  if (s === 'reader'){ $('hTitle').textContent = reader.name || 'Narrator'; window.scrollTo(0,0); if (push) hpush({ reader: reader.id, rname: reader.name }, '', '#reader=' + reader.id); renderReader(); }
  if (s === 'dl'){ $('hTitle').textContent = 'Download'; renderDownload(); window.scrollTo(0,0); if (push) hpush({ dl: current && current.id }, '', '#dl'); }
  if (s === 'sort'){ $('hTitle').textContent = 'Sort and Filter'; renderSort(); window.scrollTo(0,0); if (push) hpush({ sort:1 }, '', '#sort'); }
  if (s !== 'home') paintCloth($('subHeader'));
  if (bookId != null) hpush({ book: bookId }, '', '#book=' + bookId);
  setFooter();
}
function goHome(){ if (screen !== 'home' && hstate()) hback(); else { show('home'); hreplace(null, '', location.pathname); } }
const onPop = e => {
  if (e.state && e.state.book) openBook(e.state.book, false);
  else if (e.state && e.state.sort) show('sort', null, false);
  else if (e.state && e.state.dl && current) show('dl', null, false);
  else if (e.state && e.state.reader) { if (reader.id !== e.state.reader) Object.assign(reader, { id: e.state.reader, name: e.state.rname || '', tab: 'solo', solo: null, group: null }); show('reader', null, false); }
  else show('home');
};
window.addEventListener('popstate', onPop);
$('backBtn').onclick = () => { if (screen !== 'home') goHome(); };

// ================= EVENTS =================
document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
$('zipPick').addEventListener('change', e => importZip(e.target.files && e.target.files[0]));
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-more],[data-retry],[data-sample],[data-fav],[data-desc],[data-reopen],[data-grp],[data-reset],[data-searchall],[data-dl],[data-shuffle],[data-moremain],[data-mainretry],[data-ver],[data-reader],[data-rtab],[data-rmore],[data-rretry],[data-ritem],[data-narr],[data-veropen],[data-pickfolder],[data-savebook],[data-dlcancel],[data-dlretry],[data-copycode],[data-relaysetup],[data-relaysave],[data-relaycheck],[data-importzip]');
  if (!t) return;
  if (t.dataset.open) return openBook(t.dataset.open, true, tab !== 'saved');
  if (t.dataset.ver) return switchVersion(t.dataset.ver);

  if (t.hasAttribute('data-pickfolder')) return chooseFolder();
  if (t.hasAttribute('data-savebook')) return saveBook();
  if (t.hasAttribute('data-importzip')) return pickZip(t.dataset.importzip === 'any' ? null : current);
  if (t.hasAttribute('data-copycode')) { (navigator.clipboard ? navigator.clipboard.writeText(WORKER_CODE) : Promise.reject()).then(() => toast('Code copied — paste it in the Worker editor'), () => toast('Couldn’t copy — long-press to select')); return; }

  if (t.hasAttribute('data-relaysave') || t.hasAttribute('data-relaycheck')) {
    const inp = $('relayInput'); if (inp) { relayUrl = cleanRelay(inp.value); store.set('lv_relay', relayUrl); }
    if (!relayUrl) { relayState.ok = null; refreshDL(); return; }
    toast('Checking relay…');
    checkRelay(relayUrl).then(ok => {
      relayState.ok = ok;
      if (ok) { dlRoute = 'own'; store.set('lv_dlroute', 'own'); saveTo.jobs.forEach(x => { if (x.blocked && x.status === 'failed') { x.blocked = false; x.note = 'Relay ready — tap Retry'; } }); showRelaySetup = false; }
      toast(ok ? 'Relay working ✓ — tap Retry' : 'Relay didn’t answer — check the address and that it’s deployed');
      refreshDL();
    });
    return;
  }
  if (t.dataset.dlcancel) { const jb = saveTo.jobs.find(x => x.id == t.dataset.dlcancel); if (jb) { jb.status = 'cancelled'; refreshDL(); if (saveTo.active !== jb) pump(); } return; }
  if (t.dataset.dlretry) { const jb = saveTo.jobs.find(x => x.id == t.dataset.dlretry); if (jb) { jb.status = 'queued'; jb.blocked = false; jb.state = jb.state.map(x => x === 'fail' ? 'wait' : x); jb.note = ''; refreshDL(); pump(); } return; }
  if (t.hasAttribute('data-veropen')) { verOpen = !verOpen; if (verOpen) narrOpen = false; const y = window.scrollY; renderBook(); window.scrollTo(0, y); return; }
  if (t.hasAttribute('data-narr')) { narrOpen = !narrOpen; if (narrOpen) verOpen = false; const y = window.scrollY; renderBook(); window.scrollTo(0, y); return; }
  if (t.dataset.reader) { e.stopPropagation(); return openReader(t.dataset.reader, t.dataset.rname); }
  if (t.dataset.rtab) { reader.tab = t.dataset.rtab; window.scrollTo(0,0); return renderReader(); }
  if (t.hasAttribute('data-rmore')) return loadReader(reader.tab);
  if (t.hasAttribute('data-rretry')) { if (reader.tab === 'group') { reader.backup = null; reader.group = null; PC.set('rds|' + reader.id, null); } else reader.solo = null; return renderReader(); }
  if (t.dataset.ritem != null) { const x = (reader[reader.tab] || { items: [] }).items[+t.dataset.ritem]; if (x) openReaderItem(x); return; }
  if (t.hasAttribute('data-shuffle')) return pickMain();
  if (t.hasAttribute('data-moremain')) return moreMain();
  if (t.hasAttribute('data-mainretry')) return loadMain();
  if (t.hasAttribute('data-dl') && current) return show('dl');
  if (t.hasAttribute('data-more')) return loadMore();
  if (t.hasAttribute('data-retry')) return reload();
  if (t.hasAttribute('data-searchall')) { searchAll = searchLive.trim(); searchLive = ''; sbQ.value = searchAll; return reload(); }
  if (t.dataset.reopen) return openBook(t.dataset.reopen, false);
  if (t.hasAttribute('data-desc')) { const o = t.classList.toggle('open'); t.querySelector('.more').textContent = o ? 'Less ▴' : 'More ▾'; return; }
  if (t.dataset.grp) return pickOption(t.dataset.grp, t.dataset.val);
  if (t.hasAttribute('data-reset')) { const reloadNeeded = curSort().server !== 'desc' || prefs.genre; prefs = { sort:'newest', len:'any', lang:'all', genre:'' }; savePrefs(); renderSort(); if (reloadNeeded) reload(); else renderHome(); return; }
  if (t.hasAttribute('data-fav') && current){
    if (favs[current.id]) { delete favs[current.id]; toast('Removed from Saved'); }
    else { favs[current.id] = { book: slim(current), added: Date.now() }; toast('Saved'); }
    store.set('lv_favs', favs); renderBook(); return;
  }
  if (t.dataset.sample != null && current){
    const i = +t.dataset.sample;
    if (t.disabled) return;
    if (sample && sample.book.id == current.id && sample.sec === i) { audio.paused ? audio.play() : audio.pause(); return; }
    playSample(current, i);
  }
});

// ================= BOOKCLOTH =================
// Stack Tracker's pearlescent bookcloth: a fine plain weave lit from the top left, with a faint shimmer,
// drawn once per colour into a sheet and copied into each cloth card's canvas
const CLOTH = (() => {
  const rgb = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  const hash = (x, y, s) => { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
  const fade = t => t * t * (3 - 2 * t), frac = v => v - Math.floor(v);
  function noise(x, y, s){ const xi = Math.floor(x), yi = Math.floor(y), xf = fade(x - xi), yf = fade(y - yi);
    const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
    return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf; }
  const fbm = (x, y, s) => noise(x, y, s) * .5 + noise(x * 2.1, y * 2.1, s + 1) * .3 + noise(x * 4.3, y * 4.3, s + 2) * .2;
  const sheets = new Map(); let base = null;
  function sheet(col, s, needW, needH){
    const k = col.join(',') + '@' + s; let c = sheets.get(k);
    if (c && c.width >= needW && c.height >= needH) return c;
    const W = Math.max(needW, Math.ceil(Math.max(screen.width || 0, document.documentElement.clientWidth || 0, 420) * s));
    const H = Math.max(needH, Math.ceil(60 * s));
    c = document.createElement('canvas'); c.width = W; c.height = H;
    const p = Math.max(2, Math.round(1.2 * s)) / s;
    const weave = (u, v) => { const fu = u / p, fv = v / p, over = (Math.floor(fu) + Math.floor(fv)) & 1;
      const across = Math.sin(Math.PI * frac(fv)) * (0.55 + 0.45 * Math.sin(Math.PI * frac(fu)));
      const down = Math.sin(Math.PI * frac(fu)) * (0.55 + 0.45 * Math.sin(Math.PI * frac(fv)));
      return over ? Math.max(across, down * .55) : Math.max(down, across * .55); };
    const bk = W + 'x' + H + '@' + s;
    if (!base || base.k !== bk){
      const h = (u, v) => weave(u, v) * .6 + fbm(u * .1, v * .1, 13) * .2;
      const hg = new Float32Array((W + 1) * (H + 1));
      for (let j = 0; j <= H; j++) for (let i = 0; i <= W; i++) hg[j * (W + 1) + i] = h(i / s, j / s);
      const L = [-.45, -.6, .66], ln = Math.hypot(...L); L.forEach((v, q) => L[q] = v / ln);
      const Hv = [L[0], L[1], L[2] + 1], hn = Math.hypot(...Hv); Hv.forEach((v, q) => Hv[q] = v / hn);
      const N = W * H, A = new Float32Array(N), S = new Float32Array(N), PR = new Float32Array(N), PG = new Float32Array(N), PB = new Float32Array(N);
      for (let j = 0; j < H; j++) for (let i = 0; i < W; i++){
        const q = j * (W + 1) + i, dx = (hg[q + 1] - hg[q]) * .9 * s, dy = (hg[q + W + 1] - hg[q]) * .9 * s;
        const nl = Math.hypot(dx, dy, 1), nx = -dx / nl, ny = -dy / nl, nz = 1 / nl;
        const diff = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
        const spec = Math.pow(Math.max(0, nx * Hv[0] + ny * Hv[1] + nz * Hv[2]), 14) * .35;
        const u = i / s, v = j / s, tone = 1 + (noise(u * 1.7, v * .35, 21) - .5) * .08, sh = (0.42 + 0.68 * diff) * tone;
        const pp = .5 + .5 * Math.sin(u * .045 + v * .12), pa = .07 * (0.3 + diff), o = j * W + i;
        A[o] = sh * (1 - pa); S[o] = 255 * spec * (1 - pa);
        PR[o] = (215 + 30 * pp) * pa; PG[o] = (220 + 25 * (1 - pp)) * pa; PB[o] = 240 * pa;
      }
      base = { k: bk, A, S, PR, PG, PB };
    }
    const x = c.getContext('2d'), img = x.createImageData(W, H), d = img.data, [R, G, B] = col, { A, S, PR, PG, PB } = base;
    for (let o = 0, N = W * H; o < N; o++){ const a2 = A[o], s2 = S[o], q = o * 4;
      d[q] = R * a2 + s2 + PR[o]; d[q + 1] = G * a2 + s2 + PG[o]; d[q + 2] = B * a2 + s2 + PB[o]; d[q + 3] = 255; }
    x.putImageData(img, 0, 0); sheets.set(k, c); return c;
  }
  function draw(cv, hex, bandIn = 10){
    const col = rgb(hex), s = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
    const W = Math.round(r.width * s), H = Math.round(r.height * s);
    if (!W || !H) return;
    const key = hex + '|' + bandIn;
    if (cv.width === W && cv.height === H && cv._drawn === key) return;
    cv.width = W; cv.height = H; cv._drawn = key;
    const x = cv.getContext('2d');
    x.drawImage(sheet(col, s, W, H), 0, 0, W, H, 0, 0, W, H);
    const lg = x.createLinearGradient(0, 0, W * .25, H * 1.6); lg.addColorStop(0, 'rgba(255,255,255,.07)'); lg.addColorStop(1, 'rgba(0,0,0,.16)');
    x.fillStyle = lg; x.fillRect(0, 0, W, H);
    const g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(255,255,255,.06)'); g.addColorStop(.12, 'rgba(255,255,255,0)'); g.addColorStop(.85, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.18)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    if (bandIn < 0) return;
    const bw = Math.max(2, Math.round(2 * s)), e = Math.max(1, Math.round(s)), mix = (c, t) => Math.round(c + (255 - c) * t);
    [Math.round(bandIn * s), W - Math.round(bandIn * s) - bw].forEach(bx => {
      const bg = x.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, `rgb(${col.map(c => mix(c, .52)).join(',')})`); bg.addColorStop(1, `rgb(${col.map(c => mix(c, .4)).join(',')})`);
      x.fillStyle = bg; x.fillRect(bx, 0, bw, H);
      x.fillStyle = 'rgba(0,0,0,.28)'; x.fillRect(bx - e, 0, e, H);
      x.fillStyle = 'rgba(255,255,255,.12)'; x.fillRect(bx + bw, 0, e, H);
    });
  }
  return { draw };
})();
function paintCloth(root){
  (root || document).querySelectorAll('.cloth[data-cloth]').forEach(el => {
    el.style.setProperty('--cloth', el.dataset.cloth);
    const cv = el.querySelector(':scope > canvas'); if (!cv) return;
    const band = el.classList.contains('stats') ? -1 : el.classList.contains('bk-card') ? 3 : el.classList.contains('tab') || el.id === 'backBtn' ? 5 : 10;
    CLOTH.draw(cv, el.dataset.cloth, band);
  });
}
